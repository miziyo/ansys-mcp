name: non-live validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked environments
        run: |
          uv sync --frozen
          npm ci --ignore-scripts
      - name: Verify public repository boundary
        run: |
          uv run python scripts/sanitize_tracked_paths.py
          uv run python scripts/sanitize_tracked_paths.py
          git diff --exit-code
          uv run python scripts/audit_public_repository.py --tree-only
          uv run python scripts/export_schemas.py --check
          uv run python scripts/export_mcp_tool_snapshot.py --check
      - name: Lint and type check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/ansys_research_runner
          npm run check
      - name: Test
        run: uv run python -m pytest tests/unit tests/property tests/contract tests/integration tests/fault_injection -q
      - name: Build
        run: uv build
